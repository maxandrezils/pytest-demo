[tool.poetry]
name = "pytest-demo"
version = "0.1.0"
description = "Pytest demo repo, used to showcase pytest experience"
authors = ["Max-Andre Zils <zilsmc@gmail.com>"]
license = "Apache License"
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.12"
pytest = "8.4.2"
requests = "2.32.5"
pytest-sugar = "^1.1.1"
pytest-html = "^4.1.1"
jsonschema = "^4.25.1"
black = "^25.9.0"
pre-commit = "^3.4.0"
allure-pytest = "^2.15.0"

[tool.pytest]
testpaths = "tests"
markers = ["slow"]

[tool.pytest.plugins]
pytest-sugar = true
pytest-html = true

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
